[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-notifier"
version = "0.1.0"
description = "A local MCP tool for selective Telegram notifications from Codex"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "python-dotenv>=1,<2"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mcp_server", "telegram_notify"]
